<div class="copilot-settings">
  <h4>模型连接</h4>

  <div class="form-group" *ngFor="let p of providers">
    <label>{{ p.name }} API Key</label>
    <input type="password" class="copilot-input" [(ngModel)]="c.providerApiKeys[p.id]" (ngModelChange)="save()"
           placeholder="{{ p.apiKeyHint }}" />
    <div class="hint">{{ p.baseUrl }}</div>
  </div>

  <div class="form-group">
    <label for="copilot-endpoint">Endpoint 覆盖（可选）</label>
    <input id="copilot-endpoint" type="text" class="copilot-input" [(ngModel)]="c.endpoint" (ngModelChange)="save()"
           placeholder="留空则使用服务商默认地址" />
    <div class="hint">例如自建代理、或自定义 OpenAI 兼容端点。切换服务商后会自动清空。</div>
  </div>

  <div class="form-group">
    <label for="copilot-extra-params">额外请求参数（JSON）</label>
    <textarea id="copilot-extra-params" class="copilot-input" [(ngModel)]="c.extraParamsText" (ngModelChange)="save()"
              rows="2" placeholder='{"temperature":0.2}'></textarea>
    <div class="hint">追加到请求体，例如 temperature、max_tokens 等（非法 JSON 会被忽略）。</div>
  </div>

  <div class="form-group">
    <label for="copilot-system-prompt">追加系统指令</label>
    <textarea id="copilot-system-prompt" class="copilot-input" [(ngModel)]="c.additionalSystemPrompt" (ngModelChange)="save()"
              rows="3" placeholder="例如：始终用中文回答、不要使用 sudo…"></textarea>
    <div class="hint">会追加到内置系统指令之后，与内置指令一起发送给模型。</div>
  </div>

  <h4>安全</h4>

  <div class="form-group">
    <label for="copilot-approval">默认审批模式</label>
    <select id="copilot-approval" class="copilot-input" [(ngModel)]="c.approvalMode" (ngModelChange)="save()">
      <option value="ask">每次询问</option>
      <option value="auto_low">自动放行低风险</option>
      <option value="auto_medium">自动放行低 + 中风险</option>
      <option value="auto_all">自动放行全部（除毁灭性命令）</option>
    </select>
    <div class="hint">毁灭性命令（rm -rf /、mkfs、reboot 等）任何模式下都会强制确认。</div>
  </div>

  <div class="form-group">
    <label for="copilot-timeout">默认命令超时（秒）</label>
    <input id="copilot-timeout" type="number" class="copilot-input" min="1" max="3600"
           [ngModel]="c.defaultCommandTimeout" (ngModelChange)="setInt('defaultCommandTimeout', $event)" />
  </div>

  <h4>面板</h4>

  <div class="form-group">
    <label for="copilot-side">面板位置</label>
    <select id="copilot-side" class="copilot-input" [(ngModel)]="c.panelSide" (ngModelChange)="save()">
      <option value="right">右侧</option>
      <option value="left">左侧</option>
    </select>
  </div>

  <div class="form-group">
    <label for="copilot-fontsize">基准字号（9–24）</label>
    <input id="copilot-fontsize" type="number" class="copilot-input" min="9" max="24"
           [ngModel]="c.fontSize" (ngModelChange)="setInt('fontSize', $event)" />
  </div>

  <div class="form-group checkbox-group">
    <label><input type="checkbox" [(ngModel)]="c.focusTerminalOnRun" (ngModelChange)="save()" /> 执行时切换到终端视图</label>
  </div>
  <div class="form-group checkbox-group">
    <label><input type="checkbox" [(ngModel)]="c.showReasoning" (ngModelChange)="save()" /> 显示思考链折叠</label>
  </div>
  <div class="form-group checkbox-group">
    <label><input type="checkbox" [(ngModel)]="c.autoTitle" (ngModelChange)="save()" /> 用首条消息自动命名会话</label>
  </div>

  <h4>上下文</h4>

  <div class="form-group">
    <label for="copilot-tool-chars">单条工具结果字符上限</label>
    <input id="copilot-tool-chars" type="number" class="copilot-input" min="100"
           [ngModel]="c.maxToolResultChars" (ngModelChange)="setInt('maxToolResultChars', $event)" />
  </div>

  <div class="form-group">
    <label for="copilot-context-chars">上下文字符预算</label>
    <input id="copilot-context-chars" type="number" class="copilot-input" min="1000"
           [ngModel]="c.maxContextChars" (ngModelChange)="setInt('maxContextChars', $event)" />
  </div>
</div>
