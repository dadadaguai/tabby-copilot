<div class="composer">
  <div class="input-row" [class.busy]="busy">
    <textarea #textarea rows="1" [(ngModel)]="draft" (input)="onInput()" (keydown)="onKeydown($event)"
              [placeholder]="busy ? 'Copilot 正在思考…' : '让 Copilot 帮你干活…（Enter 发送，Shift+Enter 换行）'"
              spellcheck="false"></textarea>
    <button class="send-btn" type="button" *ngIf="!busy" [disabled]="!canSend" (click)="send()" title="发送 (Enter)">
      <i class="fas fa-arrow-up"></i>
    </button>
    <button class="send-btn stop" type="button" *ngIf="busy" (click)="stop()" title="停止">
      <i class="fas fa-stop"></i>
    </button>
  </div>
  <div class="footer">
    <select class="provider-select" [ngModel]="provider" (ngModelChange)="setProvider($event)" title="切换服务商">
      <option *ngFor="let p of providers" [value]="p.id">{{ p.name }}</option>
    </select>
    <select *ngIf="providerConfigured" class="model-select" [ngModel]="model" (ngModelChange)="setModel($event)" title="切换模型">
      <option *ngFor="let m of providerModels" [value]="m.id">{{ m.name }}</option>
    </select>
    <span *ngIf="!providerConfigured" class="key-hint">请先在设置里填 {{ providerName }} 的 API Key</span>
    <select *ngIf="providerConfigured && reasoning && efforts.length" class="reasoning-effort" [ngModel]="reasoningEffort" (ngModelChange)="setReasoningEffort($event)" title="推理强度">
      <option value="">推理：默认</option>
      <option *ngFor="let e of efforts" [value]="e">推理：{{ effortLabel(e) }}</option>
    </select>
  </div>
</div>
