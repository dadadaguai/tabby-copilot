<div class="session-list">
  <div class="sl-header">
    <span class="sl-title">会话</span>
    <button class="icon-btn" type="button" (click)="create.emit()" title="新会话"><i class="fas fa-plus"></i></button>
    <button class="icon-btn" type="button" (click)="close.emit()" title="关闭"><i class="fas fa-times"></i></button>
  </div>

  <div class="sl-body">
    <div class="sl-item" *ngFor="let s of sessions" [class.active]="s.id === currentId" (click)="open.emit(s.id)">
      <div class="sl-item-title">{{ s.title }}</div>
      <div class="sl-item-preview" *ngIf="s.preview">{{ s.preview }}</div>
      <div class="sl-item-meta">
        <span>{{ s.messageCount }} 条消息</span>
        <button class="icon-btn" type="button" (click)="$event.stopPropagation(); remove(s.id)" title="删除"><i class="fas fa-trash"></i></button>
      </div>
    </div>
    <div class="sl-empty" *ngIf="!sessions.length">还没有会话</div>
  </div>
</div>
