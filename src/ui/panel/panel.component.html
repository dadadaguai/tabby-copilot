<div class="copilot-panel" [class.side-left]="side === 'left'" [class.side-right]="side === 'right'">
  <div class="resize-handle" (mousedown)="startResize($event)" title="Drag to resize"></div>

  <header class="panel-header">
    <div class="title-area">
      <span class="brand">Copilot</span>
      <span class="subtitle" *ngIf="active">{{ active.label }} · {{ active.connection }}</span>
      <span class="subtitle muted" *ngIf="!active">未检测到终端</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" type="button" (click)="openSettings()" title="设置">
        <i class="fas fa-cog"></i>
      </button>
      <button class="icon-btn" type="button" (click)="close()" title="关闭">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </header>

  <div class="term-strip" *ngIf="active">
    <span class="dot" [ngClass]="'st-' + status"></span>
    <span class="term-status">{{ statusLabel }}</span>
    <span class="term-last-line" [title]="lastLine">{{ lastLine }}</span>
  </div>

  <copilot-transcript></copilot-transcript>

  <div class="error-bar" *ngIf="error">
    <i class="fas fa-exclamation-triangle"></i>
    <span class="error-text">{{ error }}</span>
    <button class="icon-btn" type="button" (click)="clearError()" title="关闭"><i class="fas fa-times"></i></button>
  </div>

  <copilot-composer></copilot-composer>
</div>
