<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tabby-copilot 预览</title>
<style>
  :root {
    --bg: #1b1e23; --fg: #dfe3e8; --surface: rgba(127,127,127,.10);
    --surface-2: rgba(127,127,127,.18); --border: rgba(127,127,127,.28);
    --accent: #4d9be6; --danger: #e5484d; --mono: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  .app { display: flex; flex-direction: column; height: 100vh; max-width: 880px; margin: 0 auto; width: 100%; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex: none; }
  header h1 { font-size: 15px; margin: 0; }
  .config { display: flex; gap: 8px; flex-wrap: wrap; }
  .config input, .config select { background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 13px; }
  .config input { flex: 1; min-width: 160px; }
  #transcript { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg.user { align-self: flex-end; max-width: 85%; background: var(--surface-2); padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.assistant { align-self: stretch; line-height: 1.6; }
  .reasoning-toggle { background: none; border: none; color: inherit; opacity: .6; cursor: pointer; font-size: 12px; padding: 0; margin-bottom: 4px; }
  .reasoning-toggle:hover { opacity: 1; }
  .reasoning-body { margin: 4px 0 8px; padding: 8px 10px; border-left: 2px solid var(--border); background: var(--surface); border-radius: 0 6px 6px 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; opacity: .85; }
  .md code:not(pre code) { font-family: var(--mono); font-size: .9em; background: var(--surface); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--surface); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
  .md pre code { font-family: var(--mono); font-size: 13px; }
  .typing { display: inline-flex; gap: 4px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .5; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; } 40% { opacity:.8; } }
  .composer { flex: none; padding: 10px 16px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; resize: none; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font: inherit; line-height: 1.4; max-height: 160px; }
  #input:focus { outline: none; border-color: var(--accent); }
  button.send { flex: none; height: 36px; padding: 0 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button.send.stop { background: var(--danger); }
  .error { color: var(--danger); font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>tabby-copilot 预览 · 线性流对话 + 思考链折叠</h1>
    <div class="config">
      <input id="endpoint" placeholder="endpoint" value="https://api.deepseek.com">
      <input id="apikey" placeholder="API Key（留空则用 .env）" type="password">
      <select id="model">
        <option value="deepseek-reasoner" selected>deepseek-reasoner</option>
        <option value="deepseek-chat">deepseek-chat</option>
      </select>
    </div>
  </header>

  <div id="transcript"></div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="send" id="send">发送</button>
    <button class="send stop" id="stop" style="display:none">停止</button>
  </div>
</div>

<script>
const transcript = document.getElementById('transcript')
const input = document.getElementById('input')
const sendBtn = document.getElementById('send')
const stopBtn = document.getElementById('stop')
let messages = []
let controller = null

function esc (s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

function renderMD (md) {
  let out = ''
  const lines = (md || '').split('\n')
  let inCode = false
  for (const line of lines) {
    if (line.startsWith('```')) {
      if (inCode) { out += '</code></pre>'; inCode = false }
      else { out += '<pre><code>'; inCode = true }
      continue
    }
    if (inCode) { out += esc(line) + '\n'; continue }
    let l = esc(line)
    l = l.replace(/`([^`]+)`/g, '<code>$1</code>')
    l = l.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    out += '<div>' + l + '</div>'
  }
  if (inCode) out += '</code></pre>'
  return out
}

function addUser (text) {
  const div = document.createElement('div')
  div.className = 'msg user'
  div.textContent = text
  transcript.appendChild(div)
}

function addAssistant () {
  const div = document.createElement('div')
  div.className = 'msg assistant'
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'
  transcript.appendChild(div)
  return div
}

function scrollBottom () { transcript.scrollTop = transcript.scrollHeight }

function setReasoning (el, text, streaming) {
  let wrap = el.querySelector('.reasoning-wrap')
  if (!wrap && text) {
    wrap = document.createElement('div')
    wrap.className = 'reasoning-wrap'
    el.insertBefore(wrap, el.firstChild)
  }
  if (!wrap) return
  let toggle = wrap.querySelector('.reasoning-toggle')
  if (!toggle) {
    toggle = document.createElement('button')
    toggle.className = 'reasoning-toggle'
    wrap.appendChild(toggle)
    wrap._body = document.createElement('pre')
    wrap._body.className = 'reasoning-body'
    wrap._body.style.display = 'none'
    wrap.appendChild(wrap._body)
    toggle.onclick = () => { wrap._body.style.display = wrap._body.style.display === 'none' ? '' : 'none' }
  }
  toggle.textContent = '思考过程' + (streaming ? ' …' : '')
  wrap._body.textContent = text
  if (streaming) wrap._body.style.display = ''
}

function setMarkdown (el, md) {
  let m = el.querySelector('.md')
  if (!m) { m = document.createElement('div'); m.className = 'md'; el.appendChild(m) }
  m.innerHTML = renderMD(md)
}

function setError (el, msg) {
  let e = el.querySelector('.error')
  if (!e) { e = document.createElement('div'); e.className = 'error'; el.appendChild(e) }
  e.textContent = msg
}

async function send () {
  const text = input.value.trim()
  if (!text || controller) return
  input.value = ''
  addUser(text)
  messages.push({ role: 'user', content: text })

  const endpoint = document.getElementById('endpoint').value.trim()
  const apiKey = document.getElementById('apikey').value.trim()
  const model = document.getElementById('model').value

  const el = addAssistant()
  let content = ''
  let reasoning = ''
  controller = new AbortController()
  sendBtn.style.display = 'none'
  stopBtn.style.display = ''

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint, apiKey, model, messages }),
      signal: controller.signal,
    })
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: resp.statusText }))
      throw new Error(err.error || resp.statusText)
    }
    const reader = resp.body.getReader()
    const decoder = new TextDecoder()
    let buf = ''
    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })
      let idx
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const block = buf.slice(0, idx).trim()
        buf = buf.slice(idx + 2)
        if (!block.startsWith('data:')) continue
        const data = block.slice(5).trim()
        if (data === '[DONE]') continue
        let evt
        try { evt = JSON.parse(data) } catch { continue }
        if (evt.type === 'text') { content += evt.delta; setMarkdown(el, content); setReasoning(el, reasoning, false) }
        else if (evt.type === 'reasoning') { reasoning += evt.delta; setReasoning(el, reasoning, true) }
        else if (evt.type === 'error') { throw new Error(evt.message) }
        el.querySelector('.typing')?.remove()
        scrollBottom()
      }
    }
    el.querySelector('.typing')?.remove()
    if (reasoning) setReasoning(el, reasoning, false)
    setMarkdown(el, content)
    messages.push({ role: 'assistant', content })
  } catch (e) {
    if (e.name !== 'AbortError') {
      setError(el, e.message || String(e))
      el.querySelector('.typing')?.remove()
    }
  } finally {
    controller = null
    sendBtn.style.display = ''
    stopBtn.style.display = 'none'
    scrollBottom()
  }
}

sendBtn.onclick = send
stopBtn.onclick = () => controller?.abort()
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send() }
})
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px' })
</script>
</body>
</html>
